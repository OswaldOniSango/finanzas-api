spring:
  application:
    name: finanzas-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/finanzas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finanzas}
    username: ${SPRING_DATASOURCE_USERNAME:finanzas}
    password: ${SPRING_DATASOURCE_PASSWORD:finanzas}
    driver-class-name: com.mysql.cj.jdbc.Driver
