spring:
  application:
    name: finanzas-api
  datasource:
    # CASE_INSENSITIVE_IDENTIFIERS: Flyway crea las columnas en minúscula y Spring
    # Data JDBC las cita en mayúscula (H2 usa identificadores ANSI). Sin esto, cada
    # INSERT falla con "column not found".
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/finanzas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  # Los nulos se serializan a propósito: el cliente distingue "sin presupuesto
  # definido" de "presupuesto en cero", y omitir la clave rompe esa distinción.

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  security:
    username: ${APP_SECURITY_USERNAME:admin}
    password: ${APP_SECURITY_PASSWORD:change-me-local}
    jwt-secret: ${APP_SECURITY_JWT_SECRET:local-development-secret-change-this-32-bytes}
    token-hours: ${APP_SECURITY_TOKEN_HOURS:8}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finanzas}
    username: ${SPRING_DATASOURCE_USERNAME:finanzas}
    password: ${SPRING_DATASOURCE_PASSWORD:finanzas}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:5}
  flyway:
    locations: classpath:db/postgresql
